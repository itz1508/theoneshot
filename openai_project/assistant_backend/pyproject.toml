[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audisor-assistant"
version = "0.1.0"
description = "Audisor Writing & Design Assistant — provider-neutral assistant backend."
requires-python = ">=3.11"
dependencies = [
    "audisor>=0.10.0",
    "fastapi>=0.116,<1",
    "operation-controller>=0.1.0",
    "pydantic>=2.11,<3",
    "requests>=2.32,<3",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.35,<1",
]

[tool.uv.sources]
audisor = { path = "../runtime", editable = true }
operation-controller = { path = "../operation_controller", editable = true }

[project.scripts]
audisor-assistant = "audisor_assistant.main:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.24,<5",
    "pytest>=8.4,<9",
]
grammar = [
    "language-tool-python==3.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audisor_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live_local and not live_semantic'"
markers = [
    "live_local: requires a configured local OpenAI-compatible endpoint",
    "live_semantic: semantic correctness fixtures against a live local model",
]
