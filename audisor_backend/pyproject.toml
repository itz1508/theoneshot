[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "audisor-backend"
version = "0.9.0"
description = "Canonical Fix engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "audisor>=0.9.0",
]

[tool.uv.sources]
audisor = { path = "../openai_project/runtime", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hard_stop_behavior: tests that assert legacy terminal/hard-stop behavior (flag unset)",
    "routing_behavior: tests that assert routing/suspension behavior (AUDISOR_ROUTING_ENABLED=1)",
]
